name: CI

# Triggers cover active dev branches, not just release branches: the previous
# [v2, main] filter meant daily work on feature branches got zero CI.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [v2, main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node LTS bounds only; the version dimension has never caught a bug
        # here, the platform dimension (below) caused a real incident.
        node-version: [18, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (core)
        run: npx tsc --noEmit

      - name: Type check (web server)
        run: npx tsc --noEmit -p web/tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

  check-windows:
    # The maintainer develops on Windows; a green suite there is the point.
    # Node 20 pinned for better-sqlite3 prebuilt availability.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (core)
        run: npx tsc --noEmit

      - name: Test
        run: npm test
